name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev,dashboard]"
      - name: Tests
        run: pytest --cov=agentlens --cov-report=term-missing
      - name: CLI smoke test
        run: |
          agentlens generate --runs 200 --out /tmp/t.jsonl --labels /tmp/l.json
          agentlens analyze /tmp/t.jsonl --report /tmp/r.md --html /tmp/r.html --top 3
          agentlens eval --runs 200 --robustness-seeds "" --throughput-runs 0 --out /tmp/results
